<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>沉潜 · 自介</title>
<style>
  :root{ --bg:#08080a; --panel:#101014; --line:rgba(255,255,255,.09);
    --red:#c2312f; --ink:#f2eee8; --dim:#8f8a84; --faint:#5e5a55; --ok:#5fa86b; }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{background:var(--bg);color:var(--ink);font-size:13px;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;}
  .top{height:54px;display:flex;align-items:center;gap:10px;padding:0 16px;flex:none;
    border-bottom:1px solid var(--line);background:rgba(8,8,10,.92);}
  .top .brand{font-size:14px;letter-spacing:.16em;font-weight:600;}
  .top .brand i{color:var(--red);font-style:normal;}
  .chip{font-size:10.5px;color:var(--dim);border:1px solid var(--line);padding:3px 9px;border-radius:20px;letter-spacing:.08em;}
  .top .sp{flex:1;}
  .tt{padding:7px 12px;border-radius:8px;cursor:pointer;font-size:12px;background:transparent;
    border:1px solid var(--line);color:var(--dim);letter-spacing:.06em;transition:.18s;}
  .tt:hover{border-color:var(--red);color:var(--ink);}
  .main{height:calc(100vh - 54px);overflow-y:auto;padding:22px 20px 40px;}
  .bar{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
  .bar h2{margin:0;font-size:13px;letter-spacing:.18em;color:var(--dim);font-weight:500;}
  .bar .sp{flex:1;}
  .new{padding:10px 20px;border-radius:9px;cursor:pointer;font-size:13px;background:var(--red);
    border:none;color:#fff;letter-spacing:.1em;font-weight:600;}
  .new:hover{background:#d63a37;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;}
  .cbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px;
    display:flex;flex-direction:column;gap:9px;transition:.18s;}
  .cbox:hover{border-color:rgba(194,49,47,.4);}
  .cbox .nm{font-size:17px;font-weight:600;line-height:1.35;}
  .cbox .sub{font-size:11px;color:var(--faint);font-family:ui-monospace,monospace;word-break:break-all;}
  .cbox .meta{font-size:11px;color:var(--dim);display:flex;gap:10px;flex-wrap:wrap;}
  .cbox .ops{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px;}
  .cbox .ops button{padding:5px 9px;border-radius:6px;font-size:10.5px;cursor:pointer;white-space:nowrap;
    background:transparent;border:1px solid var(--line);color:var(--dim);transition:.15s;}
  .cbox .ops button:hover{border-color:var(--red);color:var(--ink);}
  .cbox .ops button.danger:hover{border-color:#e05a56;color:#e05a56;}
  .cbox .ops button.pub{color:#e8b9b6;border-color:rgba(194,49,47,.5);}
  .empty{color:var(--faint);text-align:center;padding:70px 20px;font-size:13px;line-height:2.2;}
  .mask{position:fixed;inset:0;z-index:200;display:none;background:rgba(3,3,5,.86);
    align-items:center;justify-content:center;padding:20px;}
  .mask.show{display:flex;}
  .dialog{width:min(1180px,96vw);height:min(820px,92vh);background:#0d0d11;
    border:1px solid rgba(194,49,47,.28);border-radius:16px;display:none;flex-direction:column;
    overflow:hidden;box-shadow:0 34px 90px rgba(0,0,0,.75);}
  .mask.show .dialog{display:flex;}
  .dlg-head{display:flex;align-items:center;gap:12px;padding:13px 18px;flex:none;
    border-bottom:1px solid var(--line);background:#121216;flex-wrap:wrap;}
  .dlg-head b{font-size:14px;letter-spacing:.14em;}
  .tpls{display:flex;gap:6px;}
  .tpl{padding:6px 13px;border-radius:7px;font-size:12px;cursor:pointer;border:1px solid var(--line);
    background:transparent;color:var(--dim);transition:.15s;}
  .tpl.on{border-color:var(--red);color:#fff;background:rgba(194,49,47,.18);}
  .dlg-head .sp{flex:1;}
  .dlg-head .x{background:none;border:none;color:var(--dim);font-size:20px;cursor:pointer;line-height:1;padding:2px 6px;}
  .dlg-body{flex:1;display:flex;overflow:hidden;}
  .form{width:46%;min-width:320px;overflow-y:auto;padding:18px 18px 30px;border-right:1px solid var(--line);}
  .prev{flex:1;display:flex;align-items:center;justify-content:center;background:#0a0a0d;padding:14px;overflow:hidden;}
  .pvwrap{height:100%;max-height:760px;display:flex;flex-direction:column;gap:8px;align-items:center;width:100%;}
  .pvbar{display:flex;align-items:center;gap:10px;width:100%;flex:none;font-size:10.5px;color:var(--faint);
    letter-spacing:.14em;padding:0 2px;}
  .pvbar span{flex:1;}
  .pvbar button{background:none;border:1px solid var(--line);color:var(--dim);padding:4px 9px;
    border-radius:6px;font-size:10.5px;cursor:pointer;}
  .phone{position:relative;width:378px;flex:1;max-height:740px;border-radius:20px;overflow:hidden;
    border:1px solid rgba(255,255,255,.1);box-shadow:0 22px 60px rgba(0,0,0,.7);background:#000;}
  .pvload{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:#0a0a0d;color:var(--faint);font-size:11px;letter-spacing:.16em;}
  .phone iframe{width:100%;height:100%;border:0;display:block;}
  .grp{margin-bottom:18px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px;}
  .grp.top-grp{border-color:rgba(194,49,47,.45);background:#141013;}
  .grp > h4{margin:0 0 11px;font-size:11px;color:var(--red);letter-spacing:.2em;font-weight:600;}
  .row{margin-bottom:10px;}
  .row:last-child{margin-bottom:0;}
  .row label{display:block;font-size:11px;color:var(--dim);margin-bottom:5px;}
  .row input,.row textarea{width:100%;padding:9px 11px;background:#08080a;
    border:1px solid rgba(255,255,255,.11);border-radius:8px;color:var(--ink);font-size:13px;
    outline:none;line-height:1.6;transition:.15s;font-family:inherit;}
  .row input:focus,.row textarea:focus{border-color:var(--red);background:#0b0b0e;}
  .row textarea{resize:vertical;min-height:52px;}
  .hintx{font-size:10px;color:var(--faint);margin-top:4px;line-height:1.6;}
  .slugline{display:flex;align-items:center;}
  .slugline span{font-size:12px;color:var(--faint);padding:9px 10px;background:#0b0b0e;
    border:1px solid rgba(255,255,255,.11);border-right:none;border-radius:8px 0 0 8px;
    font-family:ui-monospace,monospace;white-space:nowrap;}
  .slugline input{border-radius:0 8px 8px 0;font-family:ui-monospace,monospace;}
  .imgrow{display:flex;align-items:center;gap:12px;}
  .imgrow img{width:62px;height:62px;border-radius:8px;object-fit:cover;
    border:1px solid rgba(194,49,47,.4);flex:none;background:#08080a;}
  .imgrow img.round{border-radius:50%;}
  .file-btn{padding:8px 13px;border-radius:8px;cursor:pointer;border:1px dashed rgba(255,255,255,.2);
    color:var(--dim);font-size:12px;}
  .dlg-foot{display:flex;align-items:center;gap:12px;padding:12px 18px;flex:none;
    border-top:1px solid var(--line);background:#121216;}
  .dlg-foot span{font-size:11px;color:var(--faint);flex:1;}
  .dlg-foot .gen{padding:12px 30px;border-radius:9px;border:none;cursor:pointer;background:var(--red);
    color:#fff;font-size:13px;letter-spacing:.12em;font-weight:600;}
  .dlg-foot .gen:disabled{opacity:.55;cursor:default;}
  .box{width:min(360px,92vw);background:var(--panel);border:1px solid rgba(194,49,47,.35);
    border-radius:14px;padding:26px 22px;text-align:center;box-shadow:0 26px 70px rgba(0,0,0,.65);}
  .box h3{margin:0 0 6px;font-size:14px;letter-spacing:.14em;}
  .box p{margin:0 0 16px;font-size:12px;color:var(--dim);line-height:1.8;}
  .box input{width:100%;padding:12px 14px;margin-bottom:12px;background:#08080a;
    border:1px solid rgba(255,255,255,.12);border-radius:9px;color:var(--ink);font-size:15px;
    text-align:center;letter-spacing:.2em;outline:none;}
  .box input:focus{border-color:var(--red);}
  .err{color:#e05a56;font-size:12px;min-height:16px;margin-bottom:6px;}
  .btns{display:flex;gap:9px;}
  .btns button{flex:1;padding:11px 0;border-radius:9px;cursor:pointer;font-size:13px;
    border:1px solid var(--line);background:transparent;color:var(--dim);}
  .btns button.primary{background:var(--red);border-color:var(--red);color:#fff;}
  .linkrow{display:flex;gap:8px;margin:14px 0 4px;}
  .linkrow input{flex:1;text-align:left;letter-spacing:0;font-size:12px;margin:0;padding:11px 12px;
    background:#08080a;border:1px solid rgba(255,255,255,.12);border-radius:9px;color:var(--ink);}
  .linkrow button{flex:none;padding:0 16px;font-size:12px;border-radius:9px;cursor:pointer;
    border:1px solid var(--line);background:transparent;color:var(--dim);}
  .linkrow button:hover{border-color:var(--red);color:#fff;}
  .setbox{width:min(520px,94vw);background:var(--panel);border:1px solid rgba(194,49,47,.35);
    border-radius:14px;padding:24px;box-shadow:0 26px 70px rgba(0,0,0,.65);}
  .setbox h3{margin:0 0 4px;font-size:14px;letter-spacing:.14em;}
  .setbox .sub{font-size:11.5px;color:var(--dim);line-height:1.9;margin-bottom:16px;}
  .setbox label{display:block;font-size:11px;color:var(--dim);margin:10px 0 5px;}
  .setbox input,.setbox textarea{width:100%;padding:10px 12px;background:#08080a;
    border:1px solid rgba(255,255,255,.12);border-radius:8px;color:var(--ink);font-size:12.5px;
    outline:none;font-family:ui-monospace,monospace;}
  .setbox textarea{min-height:74px;resize:vertical;}
  .setbox input:focus,.setbox textarea:focus{border-color:var(--red);}
  .toast{position:fixed;left:50%;bottom:11%;transform:translateX(-50%);background:rgba(18,18,21,.96);
    border:1px solid rgba(194,49,47,.45);color:var(--ink);font-size:13px;padding:11px 20px;
    border-radius:10px;z-index:300;opacity:0;pointer-events:none;transition:.22s;max-width:88vw;text-align:center;}
  .toast.show{opacity:1;}
  @media (max-width:720px){
    .dialog{width:100%;height:100%;max-height:100vh;border-radius:0;}
    .dlg-body{flex-direction:column;}
    .form{width:100%;min-width:0;border-right:none;border-bottom:1px solid var(--line);}
    .prev{display:none;}
    .mask{padding:0;}
    .main{padding:16px 14px 30px;}
    .top{padding:0 12px;gap:8px;}
    .top .brand{font-size:12px;letter-spacing:.1em;}
    .chip{display:none;}
    .tt{font-size:11px;padding:6px 9px;letter-spacing:0;}
    .grid{grid-template-columns:1fr;gap:10px;}
  }
</style>
</head>
<body>

<div class="top">
  <span class="brand">沉潜<i>自介</i></span>
  <span class="chip" id="chipRole" style="display:none">—</span>
  <span class="sp"></span>
  <button class="tt" id="btnSet" style="display:none">发布设置</button>
  <button class="tt" id="btnAdminPwd" style="display:none">改管理密码</button>
  <button class="tt" id="btnMemberPwd" style="display:none">改进门密码</button>
  <button class="tt" id="btnLogout" style="display:none">退出</button>
</div>

<div class="main">
  <div class="bar">
    <h2>全部卡 <span id="cnt"></span></h2>
    <span class="sp"></span>
    <button class="new" id="btnNew">＋ 新建卡片</button>
  </div>
  <div class="grid" id="grid"></div>
</div>

<div class="mask" id="editMask">
  <div class="dialog">
    <div class="dlg-head">
      <b id="dlgTitle">新建卡片</b>
      <div class="tpls" id="tpls"></div>
      <span class="sp"></span>
      <button class="x" id="dlgClose" type="button">×</button>
    </div>
    <div class="dlg-body">
      <div class="form" id="form"></div>
      <div class="prev">
        <div class="pvwrap">
          <div class="pvbar"><span>实时预览</span><button type="button" id="pvOpen">单独打开 ↗</button></div>
          <div class="phone"><iframe id="pv"></iframe><div class="pvload" id="pvLoad">载入中…</div></div>
        </div>
      </div>
    </div>
    <div class="dlg-foot">
      <span id="dlgHint">填好内容，右边实时预览</span>
      <button class="gen" id="btnGen">保存</button>
    </div>
  </div>
</div>

<div class="mask" id="mLogin">
  <div class="box">
    <h3>沉潜 · 自介</h3>
    <p>管理密码进管理端，进门密码进员工端</p>
    <input id="loginInput" type="text" autocomplete="off" style="-webkit-text-security:disc;text-security:disc;letter-spacing:.22em;text-align:center" placeholder="请输入密码" />
    <div class="err" id="loginErr"></div>
    <div class="btns"><button class="primary" id="loginOk" type="button">进入</button></div>
  </div>
</div>

<div class="mask" id="mPwd">
  <div class="box">
    <h3 id="pwdTitle">修改管理密码</h3>
    <p id="pwdTip">新密码至少 4 位</p>
    <input id="newPwd" type="text" autocomplete="off" placeholder="新密码" />
    <div class="err" id="pwdErr"></div>
    <div class="btns"><button id="pwdCancel" type="button">取消</button><button class="primary" id="pwdOk" type="button">保存</button></div>
  </div>
</div>


<div class="mask" id="mCardPwd">
  <div class="box">
    <h3 id="cPwdTitle">输入这张卡的密码</h3>
    <p id="cPwdTip">密码是建卡的人自己定的</p>
    <input id="cPwdInput" type="text" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="输入密码" />
    <div class="err" id="cPwdErr"></div>
    <div class="btns"><button id="cPwdCancel" type="button">取消</button><button class="primary" id="cPwdOk" type="button">进入</button></div>
  </div>
</div>

<div class="mask" id="mSet">
  <div class="setbox">
    <h3>发布设置</h3>
    <div class="sub">把卡片推到你的 GitHub Pages 上，就有公开链接了。填一次就行。</div>
    <label>仓库（用户名/仓库名）</label>
    <input id="setRepo" placeholder="MoXiaoHei0/cards" />
    <label>GitHub 授权码（token，只需仓库文件读写权限）</label>
    <textarea id="setToken" placeholder="ghp_ 或 github_pat_ 开头的一长串"></textarea>
    <label>链接前缀</label>
    <input id="setBase" placeholder="https://moxiaohei0.github.io/cards/" />
    <div class="err" id="setErr"></div>
    <div class="btns" style="margin-top:14px">
      <button id="setCancel" type="button">取消</button>
      <button id="setTest" type="button">测试连接</button>
      <button class="primary" id="setOk" type="button">保存</button>
    </div>
  </div>
</div>

<div class="mask" id="mResult">
  <div class="box" style="width:min(470px,94vw)">
    <h3 id="resTitle">发布成功</h3>
    <p>把这条链接发给对方</p>
    <div class="linkrow">
      <input id="resUrl" readonly />
      <button id="resCopy" type="button">复制</button>
    </div>
    <div class="btns" style="margin-top:14px">
      <button id="resClose" type="button">关闭</button>
      <button class="primary" id="resOpen" type="button">打开看看</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var KEY = 'cf_gh_gift';
  var SKEY = 'cf_gh_gift_session';

  function load(){
    try{
      var d = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (d && d.cards) return d;
    }catch(e){}
    return { pwd:{ admin:'1234', member:'8888' }, cards:[], set:{ repo:'', token:'', base:'' } };
  }
  function save(d){ localStorage.setItem(KEY, JSON.stringify(d)); }
  var DB = load();
  if (!DB.set) DB.set = { repo:'', token:'', base:'' };
  var CRED = sessionStorage.getItem(SKEY) || '';
  var ROLE = '';

  function toast(m, ms){
    var t = $('toast'); t.textContent = m; t.classList.add('show');
    clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove('show'); }, ms || 2400);
  }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function splitList(v){ return (v||'').split(/[,，、]/).map(function(s){return s.trim();}).filter(Boolean); }
  function pad2(n){ return n < 10 ? '0' + n : '' + n; }
  function today(){ var d = new Date(); return d.getFullYear() + '.' + pad2(d.getMonth()+1) + '.' + pad2(d.getDate()); }
  function dateOf(ts){ var d = new Date(ts); return (d.getMonth()+1) + '/' + d.getDate(); }

  var TPL = {
    redblack: { name:'红黑信纸', file:'../tpl/redblack.html', pre:'r/',
      groups:[
        {g:'基本资料', rows:[
          {k:'name', l:'圈名（页面大标题）'},
          {k:'alias', l:'其他名字'},
          {k:'tags', l:'标签（逗号分隔）', list:true},
          {k:'brief', l:'一句话简介'},
          {k:'about', l:'介绍', area:true},
        ]},
        {g:'开场与信纸', rows:[
          {k:'introBrand', l:'开场顶部小字'},
          {k:'introSub', l:'开场副标题'},
          {k:'seal', l:'信纸印章（1 个字）'},
          {k:'letterTitle', l:'信纸标题'},
          {k:'note1', l:'信纸第一行'},
          {k:'note2', l:'信纸第二行'},
          {k:'eyebrow', l:'档案页小字'},
          {k:'quote', l:'档案页引言'},
        ]},
        {g:'正文段落', rows:[
          {k:'style', l:'风格（逗号分隔）', list:true},
          {k:'rules', l:'须知（一行一条）', lines:true, area:true, big:true},
          {k:'workday', l:'接单时间 · 周中'},
          {k:'weekend', l:'接单时间 · 周末'},
          {k:'links', l:'相关链接（一行一条：名称|网址）', links:true, area:true},
        ]},
        {g:'批注与页脚', rows:[
          {k:'scribble1', l:'手写批注 · 左'},
          {k:'scribble2', l:'手写批注 · 右'},
          {k:'footer1', l:'页脚第一行'},
          {k:'footer2', l:'页脚第二行'},
        ]},
        {g:'问答（可留空）', rows:[
          {k:'q1', l:'问题一（问题 + 三个选项）', qa:true},
          {k:'q2', l:'问题二（问题 + 三个选项）', qa:true},
        ]},
      ]},
    sink: { name:'蓝色沉潜', file:'../tpl/sink.html', pre:'g/',
      groups:[
        {g:'基本信息', rows:[
          {k:'name', l:'名字（大标题）'},
          {k:'alt', l:'别名'},
          {k:'tags', l:'标签（逗号分隔，最多 3 个）', list:true},
          {k:'quote', l:'签名一句话'},
          {k:'call', l:'名字页 01 · CALL'},
          {k:'base', l:'名字页 02 · BASE'},
          {k:'attr', l:'名字页 03 · ATTR'},
        ]},
        {g:'风格四行', rows:[
          {k:'stMain', l:'01 · MAIN'},
          {k:'stSub', l:'02 · SUB'},
          {k:'stSign', l:'03 · SIGN'},
          {k:'stMood', l:'04 · MOOD'},
        ]},
        {g:'介绍', rows:[
          {k:'aboutText', l:'介绍正文（可换行）', area:true, big:true},
          {k:'like', l:'♡ 喜欢'},
          {k:'dislike', l:'✗ 雷点'},
          {k:'other', l:'✦ 其他'},
        ]},
        {g:'须知', rows:[{k:'rules', l:'须知（一行一条）', lines:true, area:true, big:true}]},
        {g:'链接（最多 5 条）', rows:[{k:'links', l:'一行一条：名称|网址|英文标注', links:true, area:true}]},
        {g:'结尾与页脚', rows:[
          {k:'endLine', l:'结尾第一行'},
          {k:'endLine2', l:'结尾第二行'},
          {k:'updated', l:'更新日期（如 2026.10.16）'},
          {k:'footL', l:'每页左下角文字'},
        ]},
      ]},
  };

  var curTpl = 'sink';
  var editId = null;
  var avatar = '', cover = '';
  var pvReady = false, pvTimer = null, slugManual = false;

  function paintRole(){
    if (!ROLE){
      $('chipRole').style.display = 'none';
      $('btnSet').style.display = 'none';
      $('btnLogout').style.display = 'none';
      $('btnAdminPwd').style.display = 'none';
      $('btnMemberPwd').style.display = 'none';
      return;
    }
    $('chipRole').style.display = '';
    $('chipRole').textContent = (ROLE === 'admin') ? '管理端' : '员工端';
    $('btnAdminPwd').style.display = (ROLE === 'admin') ? '' : 'none';
    $('btnMemberPwd').style.display = (ROLE === 'admin') ? '' : 'none';
    $('btnSet').style.display = (ROLE === 'admin') ? '' : 'none';
    $('btnLogout').style.display = '';
  }

  function valOf(f, k){
    if (k === 'q1' || k === 'q2'){
      var o = f[k] || {};
      return { text:o.text || '', opt:(o.choices || []).join(', ') };
    }
    if (k === 'tags' || k === 'style') return (f[k] || []).join(', ');
    if (k === 'rules') return (f.rules || []).join('\n');
    if (k === 'links') return (f.links || []).map(function(x){
      return (x.label || '') + '|' + (x.url || '') + (x.key ? '|' + x.key : '');
    }).join('\n');
    return f[k] || '';
  }

  function compress(file, cb){
    var rd = new FileReader();
    rd.onload = function(){
      var img = new Image();
      img.onload = function(){
        var max = 900, w = img.width, h = img.height;
        if (w > max || h > max){
          var s = max / Math.max(w, h);
          w = Math.round(w * s); h = Math.round(h * s);
        }
        var cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        cb(cv.toDataURL('image/jpeg', 0.82));
      };
      img.src = rd.result;
    };
    rd.readAsDataURL(file);
  }
  function bindUpload(inputId, imgId, setter){
    var inp = $(inputId);
    if (!inp) return;
    inp.addEventListener('change', function(e){
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      toast('处理图片…', 1200);
      compress(file, function(u){
        setter(u);
        if ($(imgId)) $(imgId).src = u;
        toast('图片已就绪');
        schedulePreview();
      });
    });
  }

  function collect(){
    var f = {};
    TPL[curTpl].groups.forEach(function(grp){
      grp.rows.forEach(function(r){
        if (r.qa){
          var t = $('fi_' + r.k + '_t'), o = $('fi_' + r.k + '_o');
          f[r.k] = { text: t ? t.value.trim() : '', choices: splitList(o ? o.value : '') };
          return;
        }
        var el = $('fi_' + r.k);
        if (!el) return;
        var v = el.value;
        if (r.list) f[r.k] = splitList(v);
        else if (r.lines) f.rules = v.split('\n').map(function(s){return s.trim();}).filter(Boolean);
        else if (r.links){
          f.links = v.split('\n').map(function(s){return s.trim();}).filter(Boolean).map(function(s){
            var p = s.split('|');
            return { label:(p[0]||'').trim(), url:(p[1]||'').trim(), key:(p[2]||'').trim() };
          }).filter(function(x){ return x.label; });
        } else f[r.k] = v.trim();
      });
    });
    if (curTpl === 'redblack'){
      f.avatar = avatar || '';
      if (!f.letterTitle) f.letterTitle = (f.name || '') + '的档案';
      if (!f.seal) f.seal = (f.name || '档').charAt(0);
      if (!f.footer2) f.footer2 = (f.name || '') + (f.brief ? ' · ' + f.brief : '');
    } else {
      f.avatar = avatar || '';
      f.cover = cover || '';
      f.footL = f.footL || ((f.name || '') + ' · 沉潜');
      f.bgmLabel = (f.name || '') + ' · 沉潜';
      f.updated = f.updated || today();
    }
    return f;
  }

  function b64(str){
    return btoa(unescape(encodeURIComponent(str)));
  }
  function ghPut(path, body){
    var s = DB.set;
    return fetch('https://api.github.com/repos/' + s.repo + '/contents/' + path, {
      method:'PUT',
      headers:{
        'Authorization':'Bearer ' + s.token,
        'Accept':'application/vnd.github+json',
        'Content-Type':'application/json'
      },
      body: JSON.stringify(body)
    });
  }
  function ghGet(path){
    var s = DB.set;
    return fetch('https://api.github.com/repos/' + s.repo + '/contents/' + path + '?ref=main', {
      headers:{ 'Authorization':'Bearer ' + s.token, 'Accept':'application/vnd.github+json' }
    });
  }

  function buildHtml(tplKey, card){
    return fetch(TPL[tplKey].file).then(function(r){
      if (!r.ok) throw new Error('模板读取失败 ' + r.status);
      return r.text();
    }).then(function(tpl){
      var data = JSON.stringify({ f:card.f, title:card.title, slug:card.slug, tpl:tplKey });
      var head = '<scr' + 'ipt>window.__CARD__=' + data + ';</scr' + 'ipt>';
      tpl = tpl.replace('<!--__CARD_JSON__-->', head);
      tpl = tpl.replace(/<title>[\s\S]*?<\/title>/i, '<title>' + card.title.replace(/[<>&]/g, '') + '</title>');
      return tpl;
    });
  }

  function publish(card, btn){
    var s = DB.set;
    if (!s.repo || !s.token){
      $('setRepo').value = s.repo || '';
      $('setToken').value = s.token || '';
      $('setBase').value = s.base || '';
      $('setErr').textContent = '';
      $('mSet').classList.add('show');
      toast('先填发布设置');
      return;
    }
    var old = btn ? btn.textContent : '';
    if (btn){ btn.disabled = true; btn.textContent = '发布中…'; }
    var path = 'gp/' + card.slug + '.html';

    buildHtml(card.tpl, card).then(function(html){
      var body = { message:'card: ' + card.title, content:b64(html), branch:'main' };
      return ghGet(path).then(function(r){
        if (r.status === 200){
          return r.json().then(function(j){ body.sha = j.sha; return ghPut(path, body); });
        }
        return ghPut(path, body);
      });
    }).then(function(r){
      return r.json().then(function(j){
        if (!r.ok) throw new Error((j && j.message) || ('HTTP ' + r.status));
        return j;
      });
    }).then(function(){
      var base = (DB.set.base || '').replace(/\/+$/, '');
      var url = base ? base + '/' + path : path;
      card.published = url; card.ts = Date.now();
      save(DB);
      if (btn){ btn.disabled = false; btn.textContent = old; }
      $('resUrl').value = url;
      $('resOpen').onclick = function(){ window.open(url, '_blank'); };
      $('mResult').classList.add('show');
      render();
    }).catch(function(e){
      if (btn){ btn.disabled = false; btn.textContent = old; }
      toast('发布失败：' + (e.message || e), 4200);
    });
  }

  $('btnAdminPwd').addEventListener('click', function(){ if (!CRED) return showLogin(); openPwdBox('admin'); });
  $('btnMemberPwd').addEventListener('click', function(){ if (!CRED) return showLogin(); openPwdBox('member'); });
  $('pwdCancel').addEventListener('click', function(){ $('mPwd').classList.remove('show'); });
  $('pwdOk').addEventListener('click', function(){
    var np = $('newPwd').value.trim();
    if (np.length < 4){ $('pwdErr').textContent = '至少 4 位'; return; }
    DB.pwd[pwdWhich] = np;
    save(DB);
    if (pwdWhich === 'admin'){ CRED = np; ROLE = 'admin'; }
    $('mPwd').classList.remove('show');
    toast('密码已改');
  });

  $('resClose').addEventListener('click', function(){ $('mResult').classList.remove('show'); });
  $('resCopy').addEventListener('click', function(){
    var el = $('resUrl');
    el.select(); el.setSelectionRange(0, 9999);
    if (navigator.clipboard) navigator.clipboard.writeText(el.value).then(function(){ toast('已复制'); })
      .catch(function(){ toast('复制失败，手动选一下'); });
    else { document.execCommand('copy'); toast('已复制'); }
  });

  if (CRED){
    ROLE = (CRED === DB.pwd.admin) ? 'admin' : (CRED === DB.pwd.member ? 'member' : '');
    if (!ROLE){ CRED = ''; try{ sessionStorage.removeItem(SKEY); }catch(e){} }
  }
  paintRole();
  render();
  if (!CRED) showLogin();
})();
</script>
</body>
</html>
