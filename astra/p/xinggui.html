<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>黑酱 · 星夜档案</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --tfront:none; --tback:none; --plotbg:none; --rose:none;
  --ink:#e9edf7; --dim:#8b96b3; --gold:#c9a86a; --line:rgba(206,220,255,.16);
  --panel:rgba(12,17,30,.55); --deep:#05070d;
}
html,body{height:100%;background:var(--deep);color:var(--ink);
  font-family:"Songti SC","Noto Serif SC",Georgia,"Times New Roman",serif;
  -webkit-font-smoothing:antialiased;overflow:hidden}
body{position:relative}

/* 星空底 */
#stars{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(1200px 700px at 18% 8%, rgba(88,120,190,.22), transparent 62%),
    radial-gradient(900px 600px at 82% 22%, rgba(120,96,180,.18), transparent 60%),
    radial-gradient(760px 520px at 50% 92%, rgba(40,70,130,.22), transparent 64%),
    linear-gradient(180deg,#05070d 0%,#080c16 48%,#04060b 100%);}
#stars:after{content:"";position:absolute;inset:0;opacity:.5;
  background-image:
    radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,.65), transparent),
    radial-gradient(1px 1px at 34% 62%, rgba(255,255,255,.5), transparent),
    radial-gradient(1px 1px at 67% 12%, rgba(255,255,255,.7), transparent),
    radial-gradient(1px 1px at 86% 44%, rgba(255,255,255,.45), transparent),
    radial-gradient(1px 1px at 48% 78%, rgba(255,255,255,.55), transparent),
    radial-gradient(1px 1px at 22% 88%, rgba(255,255,255,.35), transparent),
    radial-gradient(1.5px 1.5px at 74% 68%, rgba(201,168,106,.55), transparent),
    radial-gradient(1px 1px at 6% 54%, rgba(255,255,255,.4), transparent);}

/* 屏 */
.screen{position:fixed;inset:0;z-index:2;overflow-y:auto;overflow-x:hidden;
  opacity:0;visibility:hidden;transform:translateY(14px);
  transition:opacity .72s ease, transform .72s ease, visibility .72s;
  -webkit-overflow-scrolling:touch}
.screen.on{opacity:1;visibility:visible;transform:none}

.wrap{max-width:660px;margin:0 auto;padding:64px 26px 104px;position:relative;
  box-sizing:border-box;min-height:100dvh;
  display:flex;flex-direction:column;justify-content:safe center}

/* 顶部小标 */
.kicker{font-family:Georgia,serif;font-size:10px;letter-spacing:.42em;
  text-transform:uppercase;color:var(--dim);text-align:center}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);
  margin:18px 0}
.rule.dia{height:auto;background:none;text-align:center;margin:26px 0}
.rule.dia:after{content:"◇";position:static;transform:none;background:none;padding:0;
  display:inline-block;font-size:12px;color:rgba(201,168,106,.75)}

/* 章节头 */
.chap{display:flex;align-items:baseline;gap:10px;margin-bottom:22px}
.chap .no{font-size:11px;letter-spacing:.2em;color:var(--gold)}
.chap .cn{font-size:19px;letter-spacing:.18em}
.chap .en{font-size:9px;letter-spacing:.34em;text-transform:uppercase;color:var(--dim);margin-left:auto}

/* 开场：塔罗牌 */
.tarot{position:relative;width:min(58vw,238px);aspect-ratio:5/7.6;margin:30px auto 0;
  cursor:pointer;perspective:1200px;
  transition:opacity 1s ease, transform 1s ease}
.tarot .glow{position:absolute;inset:-7px;z-index:-1;pointer-events:none;border-radius:2px;
  box-shadow:
    0 0 12px 2px rgba(255,255,255,.2),
    0 0 26px 6px rgba(255,255,255,.12),
    0 0 50px 14px rgba(255,255,255,.06),
    0 0 88px 24px rgba(235,242,255,.03);
  animation:glow 4.4s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.66}50%{opacity:1}}
.tarot .flipper{position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform .96s cubic-bezier(.45,.06,.24,1)}
.tarot.flipped .flipper{transform:rotateY(180deg)}
.facecard{position:absolute;inset:0;padding:0;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#05070d center/100% 100% no-repeat;
  background-origin:border-box;background-clip:border-box;
  overflow:hidden}
.facecard.front{background-image:var(--tfront)}
.facecard.back{transform:rotateY(180deg);background-image:var(--tback)}
.corner{position:absolute;width:13px;height:13px;border:1px solid rgba(236,242,255,.45)}
.corner.tl{top:15px;left:15px;border-right:0;border-bottom:0}
.corner.tr{top:15px;right:15px;border-left:0;border-bottom:0}
.corner.bl{bottom:15px;left:15px;border-right:0;border-top:0}
.corner.br{bottom:15px;right:15px;border-left:0;border-top:0}
.tno{position:absolute;top:19px;left:0;right:0;text-align:center;
  font-family:Georgia,serif;font-size:9px;letter-spacing:.44em;color:rgba(214,226,246,.7)}
.tname{writing-mode:vertical-rl;font-size:clamp(26px,6.8vw,38px);letter-spacing:.12em;
  line-height:1.2;color:#f1f4fc;margin:2px 0;
  text-shadow:0 0 28px rgba(200,216,255,.55),0 0 60px rgba(150,175,235,.3)}
.ten{font-family:Georgia,serif;font-size:8px;letter-spacing:.34em;
  text-transform:uppercase;color:rgba(160,172,198,.9);margin-top:12px}
.star{font-size:12px;color:rgba(230,240,255,.55);margin-top:12px}
.fbody{font-size:11px;line-height:1.95;letter-spacing:0;color:#dae2f2;
  width:100%;padding:44px 42px;box-sizing:border-box;
  text-align:center;white-space:pre-wrap;overflow:hidden}
.fbody.big{writing-mode:vertical-rl;font-size:clamp(30px,8vw,42px);letter-spacing:.34em;
  line-height:1.12;color:#eef4ff;white-space:normal;width:auto;height:auto;
  padding:0;margin:0 auto;text-align:center;font-weight:300;
  text-shadow:0 0 26px rgba(205,225,255,.42),0 0 54px rgba(150,190,255,.18)}
.optwrap{margin-top:26px;text-align:center;opacity:0;transform:translateY(6px);
  transition:opacity .7s ease .18s, transform .7s ease .18s;pointer-events:none}
.optwrap.on{opacity:1;transform:none;pointer-events:auto}
.opt{background:none;border:1px solid rgba(226,236,250,.28);color:#e2e9f7;
  font-family:inherit;font-size:12px;letter-spacing:.3em;padding:12px 34px;
  cursor:pointer;border-radius:1px;transition:.4s;min-height:44px}
.opt:hover{border-color:rgba(255,255,255,.62);box-shadow:0 0 26px -6px rgba(220,235,255,.45)}
.tarot.revealed{transform:rotateY(84deg) scale(.84);opacity:0}
.under{font-size:12.5px;font-style:italic;letter-spacing:.08em;color:#b9c4dc;
  margin-top:24px;line-height:1.9;text-align:center}
.hint2{font-size:9px;letter-spacing:.42em;text-transform:uppercase;
  color:rgba(201,168,106,.5);margin-top:16px;text-align:center}
.editbtn{position:fixed;left:14px;top:14px;z-index:20;display:none;width:34px;height:34px;
  background:rgba(10,14,24,.55);border:1px solid rgba(206,220,255,.16);color:#8b96b3;
  font-size:14px;font-family:inherit;cursor:pointer;border-radius:1px;line-height:1}
.editbtn:hover{color:var(--gold);border-color:rgba(201,168,106,.5)}
.enter{display:block;margin:46px auto 0;padding:13px 46px;background:transparent;
  border:1px solid rgba(206,220,255,.34);color:var(--ink);font-family:inherit;
  font-size:13px;letter-spacing:.34em;cursor:pointer;border-radius:1px;
  transition:.45s;position:relative;overflow:hidden}
.enter:before{content:"";position:absolute;inset:0;background:rgba(160,190,255,.14);
  transform:translateX(-101%);transition:.55s}
.enter:hover:before{transform:none}
.enter span{position:relative}
.vert{position:absolute;top:96px;right:24px;writing-mode:vertical-rl;
  font-size:10px;letter-spacing:.4em;color:rgba(201,168,106,.5)}

/* 主界面 */
.main-grid{display:flex;gap:26px;align-items:center;margin:8px 0 30px;flex-wrap:wrap}
.portrait{position:relative;flex:0 0 auto;width:132px;height:132px}
.portrait img{width:100%;height:100%;object-fit:cover;border-radius:50%;
  filter:grayscale(.18) contrast(1.05) brightness(.95)}
.portrait .ph{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  font-size:36px;letter-spacing:.1em;color:rgba(201,168,106,.55);
  border:1px solid rgba(206,220,255,.14);border-radius:50%;
  background:radial-gradient(circle at 50% 40%,rgba(80,110,180,.22),rgba(8,11,20,.6))}
.portrait .ring{position:absolute;inset:-13px;border-radius:50%;
  border:1px dashed rgba(201,168,106,.45);animation:spin 26s linear infinite}
.portrait .ring2{position:absolute;inset:-4px;border-radius:50%;
  border:1px solid rgba(206,220,255,.22)}
@keyframes spin{to{transform:rotate(360deg)}}
.main-txt{flex:1 1 240px;min-width:0}
.main-name{font-size:34px;letter-spacing:.14em;line-height:1.3}
.main-alias{font-size:12px;letter-spacing:.22em;color:var(--dim);margin-top:8px}
.touts{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}
.tout{font-size:11px;letter-spacing:.12em;padding:5px 11px;
  border:1px solid var(--line);color:#cfd8ee;border-radius:1px}

/* 入口四格 */
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.door{background:rgba(14,19,34,.62);border:1px solid var(--line);border-radius:2px;
  padding:18px 10px 14px;text-align:center;cursor:pointer;transition:.35s;
  position:relative}
.door:hover{border-color:rgba(201,168,106,.55);background:rgba(24,32,52,.7)}
.door .sym{font-size:17px;color:var(--gold);display:block;margin-bottom:9px}
.door .cn{font-size:13px;letter-spacing:.2em}
.door .en{font-size:8px;letter-spacing:.3em;color:var(--dim);
  text-transform:uppercase;margin-top:5px;display:block}

/* 属性 */
.attr-row{display:flex;align-items:center;gap:14px;margin-bottom:15px}
.attr-k{flex:0 0 88px;font-size:12px;letter-spacing:.14em;color:#c6d0e8}
.attr-bar{flex:1 1 auto;height:2px;background:rgba(206,220,255,.13);position:relative}
.attr-bar i{position:absolute;left:0;top:0;height:2px;display:block;
  background:linear-gradient(90deg,rgba(201,168,106,.85),rgba(206,220,255,.5))}
.attr-v{flex:0 0 34px;text-align:right;font-size:10px;color:var(--dim);letter-spacing:.1em}

/* 任务 */
.task{display:flex;gap:14px;padding:16px;border:1px solid var(--line);
  background:var(--panel);margin-bottom:10px}
.task .t-no{font-size:10px;color:var(--gold);letter-spacing:.2em;flex:0 0 auto;padding-top:3px}
.task .t-tt{font-size:13px;letter-spacing:.12em;margin-bottom:5px}
.task .t-ds{font-size:12px;color:#a9b4cd;line-height:1.8}
.tick{display:flex;gap:10px;align-items:flex-start;padding:9px 0;
  border-bottom:1px solid rgba(206,220,255,.07);font-size:12.5px;color:#bcc7de;line-height:1.7}
.tick b{flex:0 0 12px;height:12px;border:1px solid rgba(206,220,255,.3);margin-top:3px}

/* 剧情 */
.plot{padding:18px 16px;border-left:2px solid rgba(201,168,106,.4);
  background:linear-gradient(90deg,rgba(201,168,106,.06),transparent 70%);
  margin-bottom:12px;font-size:13.5px;line-height:2.05;color:#cdd6ea;letter-spacing:.02em}
.plot .pno{font-size:9px;letter-spacing:.3em;color:var(--gold);display:block;margin-bottom:7px}

/* 寻灵 */
.cards2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.sumcard{position:relative;min-height:150px;border:1px solid var(--line);
  background:var(--panel);cursor:pointer;padding:18px 16px;transition:.5s;
  overflow:hidden}
.sumcard .sq{font-size:13px;line-height:1.9;letter-spacing:.06em;color:#d7dff2}
.sumcard .sa{margin-top:14px;font-size:12px;color:var(--gold);line-height:1.9;
  opacity:0;transition:opacity .5s}
.sumcard.flip .sa{opacity:1}
.sumcard .hint{position:absolute;right:12px;bottom:10px;font-size:9px;
  letter-spacing:.28em;color:rgba(139,150,179,.7);text-transform:uppercase}

/* 尾声 */
.links a{display:flex;justify-content:space-between;align-items:center;gap:14px;
  padding:13px 2px;border-bottom:1px solid rgba(206,220,255,.1);
  color:#dbe3f6;text-decoration:none;font-size:13px;letter-spacing:.06em}
.links a span.k{font-size:10px;letter-spacing:.26em;color:var(--dim);text-transform:uppercase}
.links a:hover{color:var(--gold)}

/* 底部栏 */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;
  justify-content:space-between;align-items:center;padding:12px 20px;
  font-size:10px;letter-spacing:.24em;color:rgba(139,150,179,.85);
  background:linear-gradient(0deg,rgba(5,7,13,.94),transparent);
  pointer-events:none}
.bar button{pointer-events:auto;background:none;border:1px solid rgba(206,220,255,.2);
  color:#bcc7de;font-family:inherit;font-size:10px;letter-spacing:.24em;
  padding:8px 16px;cursor:pointer;border-radius:1px}
.bar button:hover{border-color:rgba(201,168,106,.55);color:var(--gold)}

.mnote{font-size:11px;color:rgba(201,168,106,.6);letter-spacing:.1em;
  margin-top:22px;line-height:2;font-style:italic}

/* fuorescent */
.fireflies{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden}
.fireflies span{position:absolute;border-radius:50%;background:rgba(200,238,255,.95);
  box-shadow:0 0 5px rgba(170,225,255,.95),0 0 13px rgba(110,185,255,.6);
  animation:ffmove linear infinite, fffade ease-in-out infinite}
@keyframes ffmove{0%{transform:translate3d(0,0,0)}50%{transform:translate3d(var(--dx),var(--dy),0)}100%{transform:translate3d(0,0,0)}}
@keyframes fffade{0%,100%{opacity:.06}38%{opacity:.95}72%{opacity:.30}}
@media (max-width:560px){.fireflies span{box-shadow:0 0 4px rgba(170,225,255,.85),0 0 9px rgba(110,185,255,.5)}}
@media (max-width:560px){
  .wrap{padding:52px 20px 96px}
  .tarot{width:min(64vw,228px);margin:24px auto 0}
  .tarot .tname{font-size:clamp(23px,7.4vw,32px);letter-spacing:.16em}
  .under{font-size:11.5px;margin-top:20px;line-height:1.85}
  .hint2{font-size:8.5px;letter-spacing:.34em;margin-top:14px}
  .enter{margin-top:36px;padding:14px 38px;font-size:12px;min-height:46px}
  .chap .cn{font-size:17px}
  .chap .en{display:none}
  .main-grid{flex-direction:column;align-items:center;text-align:center;gap:16px;margin:4px 0 22px}
  .portrait{width:96px;height:96px}
  .main-txt{flex:none;width:100%}
  .main-name{font-size:26px}
  .touts{justify-content:center}
  .doors{grid-template-columns:1fr 1fr;gap:9px}
  .door{padding:17px 8px 13px;min-height:78px}
  .attr-k{flex:0 0 64px;font-size:11px;letter-spacing:.1em}
  .attr-v{flex:0 0 28px;font-size:9px}
  .task{padding:14px}
  .task .t-tt{font-size:12px}
  .task .t-ds{font-size:11.5px}
  .tick{font-size:12px}
  .plot{padding:15px 13px;font-size:12.5px;line-height:1.95}
  .sumcard{min-height:128px;padding:15px 14px}
  .bar{padding:11px 18px calc(11px + env(safe-area-inset-bottom))}
  .bar button{padding:10px 18px;min-height:42px}
  .vert{display:none}
}
/* ---- 就地编辑面板 ---- */
.ed{position:fixed;inset:0;background:rgba(3,7,15,.965);z-index:10000;
  display:none;overflow-y:auto;padding:24px 16px 112px;-webkit-overflow-scrolling:touch}
.ed.on{display:block}
.ed-in{max-width:540px;margin:0 auto}
.ed-h{font-size:12px;letter-spacing:.26em;color:#c9a86a;margin-bottom:16px}
.ed-f{margin-bottom:11px}
.ed-f label{display:block;font-size:10px;color:#7d8aa6;letter-spacing:.12em;margin-bottom:5px}
.ed-f input,.ed-f textarea{width:100%;background:rgba(255,255,255,.04);
  border:1px solid rgba(150,175,225,.2);color:#dae2f2;font-size:13px;
  padding:8px 10px;border-radius:4px;font-family:inherit;outline:none;
  -webkit-appearance:none}
.ed-f textarea{min-height:60px;resize:vertical;line-height:1.7}
.ed-f input:focus,.ed-f textarea:focus{border-color:rgba(201,168,106,.62)}
.ed-btns{position:fixed;left:0;right:0;bottom:0;padding:12px 16px;
  background:linear-gradient(to top,rgba(4,8,16,.99) 0%,rgba(4,8,16,.95) 62%,rgba(4,8,16,.88) 100%);-webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px);
  display:flex;gap:8px;max-width:540px;margin:0 auto;z-index:10001}
.ed-btns button{flex:1;min-height:40px;background:transparent;
  border:1px solid rgba(150,175,225,.28);color:#dae2f2;font-size:12px;
  letter-spacing:.12em;border-radius:3px;font-family:inherit;cursor:pointer}
.ed-btns button#edPub{border-color:rgba(201,168,106,.55);color:#e2cf9f}
.ed-msg{position:fixed;left:0;right:0;bottom:66px;text-align:center;
  font-size:11px;color:#8fb8e0;letter-spacing:.06em;z-index:10002;
  pointer-events:none;opacity:0;transition:opacity .3s}
.ed-msg.on{opacity:1}

/* 主界面：从上往下一排排浮现 */
#s2 .chap{animation:riseIn .8s both}
#s2 .rule{animation:riseIn .8s .10s both}
#s2 .main-grid{animation:riseIn .9s .22s both}
#s2 .door{animation:riseIn .85s both}
#s2 .door:nth-child(1){animation-delay:.38s}
#s2 .door:nth-child(2){animation-delay:.46s}
#s2 .door:nth-child(3){animation-delay:.54s}
#s2 .door:nth-child(4){animation-delay:.62s}
@keyframes riseIn{from{opacity:0;transform:translateY(22px);filter:blur(7px)}
  to{opacity:1;transform:translateY(0);filter:blur(0)}}

/* 风格卡 */
.stylegrid{display:flex;flex-wrap:wrap;gap:9px;margin-top:4px}
.st-card{flex:1 1 44%;min-width:0;position:relative;padding:14px 12px 16px;
  border:1px solid rgba(150,175,225,.16);border-radius:3px;overflow:hidden;
  background:linear-gradient(155deg,rgba(255,255,255,.055),rgba(255,255,255,.008))}
.st-no{font-size:9px;letter-spacing:.22em;color:#c9a86a;opacity:.85}
.st-name{display:block;font-size:18px;letter-spacing:.16em;color:#eef2fb;margin-top:10px}
.st-en{display:block;font-size:8.5px;letter-spacing:.26em;color:#78869f;margin-top:7px}
.st-line{position:absolute;left:13px;right:13px;bottom:0;height:1px;
  background:linear-gradient(90deg,rgba(201,168,106,.45),rgba(201,168,106,0))}

/* 须知 */
.nt-times{margin-bottom:20px}
.nt-time{display:flex;justify-content:space-between;align-items:baseline;
  padding:8px 0;border-bottom:1px dashed rgba(150,175,225,.12)}
.nt-k{font-size:10px;letter-spacing:.16em;color:#8b98b2}
.nt-v{font-size:12px;color:#d8e0f0}
.nt{display:flex;gap:12px;align-items:flex-start;
  border-left:1px solid rgba(201,168,106,.22);padding:12px 0 12px 14px;margin-left:2px}
.nt-no{flex:0 0 auto;font-size:9.5px;letter-spacing:.16em;color:#c9a86a;padding-top:3px}
.nt-t{font-size:12.5px;line-height:1.95;color:#dce4f4}

/* 对话剧情：神谕 */
.oracle{position:relative;text-align:center;padding:14px 0 6px}
.oracle:before{content:'';position:absolute;left:50%;top:14%;
  width:min(84vw,430px);height:min(84vw,430px);transform:translate(-50%,-14%);
  border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(168,198,255,.15),rgba(120,160,230,.05) 46%,transparent 70%)}
.or-line{font-family:Georgia,'Songti SC','STSong',serif;font-size:15px;line-height:2.55;
  letter-spacing:.09em;color:#e9eefb;max-width:min(25em,100%);margin:0 auto;
  text-shadow:0 0 24px rgba(168,198,255,.4);opacity:0;animation:oracleIn 1.6s both}
.or-star{font-size:10px;color:rgba(201,168,106,.8);letter-spacing:.4em;margin:20px 0 10px;
  opacity:0;animation:oracleIn 1.2s both}
@keyframes oracleIn{from{opacity:0;transform:translateY(16px);filter:blur(8px)}
  to{opacity:1;transform:translateY(0);filter:blur(0)}}


/* 剧情页：太阳众手背景 */
.plotbg{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.15;
  background-image:var(--plotbg);background-position:center 7%;
  background-size:min(88vw,470px) auto;background-repeat:no-repeat;filter:blur(.4px);
  -webkit-mask-image:radial-gradient(ellipse 64% 46% at 50% 33%,
    rgba(0,0,0,.95) 18%,rgba(0,0,0,.55) 52%,transparent 80%);
  mask-image:radial-gradient(ellipse 64% 46% at 50% 33%,
    rgba(0,0,0,.95) 18%,rgba(0,0,0,.55) 52%,transparent 80%)}

/* 对话框 */
.dlg{display:flex;flex-direction:column;gap:15px;margin-top:16px;position:relative;z-index:1}
.dlg-row{display:flex}
.dlg-row.r{justify-content:flex-end}

  put($('vName'), f.name || '未命名');

  put($('vAliasEn'), (f.alias || '').toUpperCase());
  put($('vAlias'), f.alias || '');
  put($('vBrief'), f.brief || '');
  document.title = (c && c.title) || f.name || '档案';

  var av = $('vAvatar'), ph = $('vPh');
  if (av){
    if (f.avatar){ av.src = f.avatar; av.style.display = ''; if (ph) ph.style.display = 'none'; }
    else {
      av.style.display = 'none';
      if (ph){
        ph.style.display = 'flex';
        ph.textContent = (f.name || '✧').slice(0, 1);
      }
    }
  }

  /* 称号 */
  var tags = f.tags || [];
  ['vTouts'].forEach(function(id){
    var box = $(id); if (!box) return;
    box.innerHTML = '';
    tags.forEach(function(t){ if (t) box.appendChild(div('tout', t)); });
  });

  /* 风格 */
  var attrs = $('vAttrs'); if (attrs){
    attrs.innerHTML = '';
    var list = (f.style && f.style.length) ? f.style : tags;
    var pct = [100, 92, 84, 76, 68, 60];
    list.forEach(function(name, i){
      if (!name) return;
      var row = document.createElement('div'); row.className = 'attr-row';
      row.appendChild(div('attr-no', '0' + (i + 1)));
      row.appendChild(div('attr-name', name));
      var bar = document.createElement('div'); bar.className = 'attr-bar';
      var fill = document.createElement('div'); fill.className = 'attr-fill';
      fill.setAttribute('data-w', pct[i] || 60);
      fill.style.width = (pct[i] || 60) + '%';
      bar.appendChild(fill); row.appendChild(bar);
      row.appendChild(div('attr-val', (pct[i] || 60) + '%'));
      attrs.appendChild(row);
    });
  }

  /* 须知：营业时间 */
  var times = $('vTimes');
  if (times){
    times.innerHTML = '';
    var tt = [];
    if (f.workday) tt.push(['工作日 · 周中', f.workday]);
    if (f.weekend) tt.push(['休息日 · 周末', f.weekend]);
    tt.forEach(function(x){
      var row = document.createElement('div'); row.className = 'nt-time';
      row.appendChild(div('nt-k', x[0])); row.appendChild(div('nt-v', x[1]));
      times.appendChild(row);
    });
  }
  /* 须知：条款 */
  var tasks = $('vTasks');
  if (tasks){
    tasks.innerHTML = '';
    (f.rules || []).forEach(function(r, i){
      if (!r) return;
      var row = document.createElement('div'); row.className = 'nt';
      var no = document.createElement('span'); no.className = 'nt-no';
      no.textContent = ('0' + (i + 1)).slice(-2);
      var tx = document.createElement('span'); tx.className = 'nt-t';
      tx.textContent = r;
      row.appendChild(no); row.appendChild(tx);
      tasks.appendChild(row);
    });
  }

  /* 剧情：对话气泡，逐条浮现 */
  var plots = $('vPlots');
  if (plots && $('vOpts')){
    plots.innerHTML = '';
    var optsB = $('vOpts'); optsB.innerHTML = '';
    var rounds = parseScript(f);
    var ri = 0;

    var roundBox = null;
    var addBub = function(txt, side){
      var row = document.createElement('div');
      row.className = 'dlg-row' + (side === 'r' ? ' r' : '');
      var b = document.createElement('div'); b.className = 'bub';
      b.textContent = txt;
      row.appendChild(b);
      (roundBox || plots).appendChild(row);
      var sc = $('s5');
      if (sc) setTimeout(function(){ sc.scrollTop = sc.scrollHeight; }, 260);
    };

    var showRound = function(i){
      if (i >= rounds.length){ if (roundBox) roundBox.classList.add('past'); return; }
      var r = rounds[i];
      if (roundBox) roundBox.classList.add('past');
      roundBox = document.createElement('div');
      roundBox.className = 'dround';
      plots.appendChild(roundBox);
      addBub(r.line, 'l');
      optsB.innerHTML = '';
      setTimeout(function(){
        r.options.forEach(function(o){
          var b = document.createElement('div');
          b.className = 'optbtn';
          b.textContent = o.label;
          b.onclick = function(){
            if (b.classList.contains('dim')) return;
            [].forEach.call(optsB.children, function(x){ x.classList.add('dim'); });
            b.classList.remove('dim'); b.classList.add('on');
            if (o.reply) addBub(o.reply, 'r');
            setTimeout(function(){ optsB.innerHTML = ''; showRound(i + 1); }, 1000);
          };
          optsB.appendChild(b);
        });
      }, 620);
    };
    showRound(0);
  }

  function parseScript(c){
    var raw = (c.script || '').trim();
    var out = [];
    var push = function(line){ out.push({line: line, options: []}); };
    if (raw){
      raw.split(/\n+/).forEach(function(ln){
        ln = ln.trim(); if (!ln) return;
        if (ln.indexOf('|') > -1 && out.length){
          var a = ln.split('|');
          out[out.length - 1].options.push({label: (a[0]||'').trim(), reply: (a[1]||'').trim()});
        } else { push(ln); }
      });
      if (out.length) return out;
    }
    var O = [
      [(c.optA || '').trim() || '我跟着你走', (c.brA || '').trim()],
      [(c.optB || '').trim() || '我先问一句', (c.brB || '').trim()],
      [(c.optC || '').trim() || '我只是路过', (c.brC || '').trim()]
    ];
    var body = ((c.about || '')).trim();
    var paras = body ? body.split(/\n+/).filter(function(x){ return x.trim(); }) : [];
    paras.forEach(function(t){
      out.push({line: t.trim(), options: O.map(function(x){ return {label: x[0], reply: x[1]}; })});
    });
    return out;
  }

  /* 寻灵：两道问答 */
  var sum = $('vSum');
  if (sum){
    sum.innerHTML = '';
    [{k:'q1', n:'I'}, {k:'q2', n:'II'}].forEach(function(q){
      var o = f[q.k];
      if (!o || !o.text) return;
      var card = document.createElement('div'); card.className = 'sumcard';
      var sq = div('sq', o.text);
      var sa = div('sa', (o.choices || []).join('　／　'));
      var hint = div('hint', 'TAP');
      card.appendChild(sq); card.appendChild(sa); card.appendChild(hint);
      card.onclick = function(){ card.classList.toggle('flip'); };
      sum.appendChild(card);
    });
  }

  /* 尾声：链接 + 批注 + 页脚 */
  var links = $('vLinks');
  if (links){
    links.innerHTML = '';
    (f.links || []).forEach(function(x){
      if (!x || !x.label) return;
      var a = document.createElement('a');
      a.href = x.url || 'javascript:void(0)';
      if (x.url) { a.target = '_blank'; a.rel = 'noopener'; }
      var l = document.createElement('span'); l.textContent = x.label;
      var k = document.createElement('span'); k.className = 'k'; k.textContent = x.key || 'LINK';
      a.appendChild(l); a.appendChild(k);
      links.appendChild(a);
    });
  }
  put($('vNote'), [f.scribble1, f.scribble2].filter(Boolean).join('　'));
  put($('vFoot'), f.footer1 || '');

  /* 牌面：填了内容就排版显示，只填标题就竖排大字 */
  var fb = $('vFaceBody');
  var ftxt = (f.tarotText || '').trim();
  if (fb){
    if (ftxt){ fb.className = 'fbody'; fb.textContent = ftxt; }
    else { fb.className = 'fbody big'; fb.textContent = (f.faceBig || '').trim() || f.name || ''; }
  }
  put($('btnOpt'), f.optText || '进 入');

  /* 背景音乐：自己有就用自己的，没有就用站点自带的那首 */
  var bg = $('bgm');
  if (bg){ bg.src = f.bgm || DEFAULT_BGM; BG = bg; }
}

/* 揭牌：点牌翻到反面（内容面），牌下浮出选项；点选项进主界面 */
var tarot = $('tarotCard'), opened = false;
function resetTarot(){
  if (!tarot) return;
  tarot.classList.remove('flipped');
  tarot.classList.remove('revealed');
  opened = false;
  var ow = $('optWrap'); if (ow) ow.classList.remove('on');
  var h = $('vHint'); if (h) h.textContent = 'Tap to reveal';
}
function enterMain(){
  if (tarot) tarot.classList.add('revealed');
  setTimeout(function(){ go('s2'); }, 1080);
}
if (tarot){
  tarot.onclick = function(){
    if (BG){ try{ BG.play(); }catch(e){} }
    if (!opened){
      opened = true;
      tarot.classList.add('flipped');
      var h = $('vHint'); if (h) h.textContent = 'Tap again to enter';
      setTimeout(function(){
        var ow = $('optWrap'); if (ow) ow.classList.add('on');
      }, 260);
      return;
    }
    enterMain();
  };
}
var bo = $('btnOpt');
if (bo){
  bo.onclick = function(e){
    if (e && e.stopPropagation) e.stopPropagation();
    if (BG){ try{ BG.play(); }catch(e){} }
    enterMain();
  };
}
$('btnBack').onclick = function(){
  if (cur === 's2') go('s1'); else go('s2');
};
var doors = document.querySelectorAll('.door');
for (var i = 0; i < doors.length; i++){
  doors[i].onclick = function(){
    var s2c = $('s2'); if (s2c) s2c.classList.remove('lock');
    go(this.getAttribute('data-go'));
  };
}
var nbs = document.querySelectorAll('.nextbox');
for (var n = 0; n < nbs.length; n++){
  nbs[n].onclick = function(){ go(this.getAttribute('data-next')); };
}


/* 左上角编辑：就地修改，不跳工厂 */
var EFIELDS = [
  ['name','名字'],['alias','英文别名'],['brief','一句话介绍'],
  ['introBrand','顶部英文小标'],['introSub','顶部中文副标'],
  ['tags','标签（逗号分隔）'],['style','关键词（逗号分隔）'],
  ['workday','平日时段'],['weekend','周末时段'],
  ['faceBig','牌面竖排大字'],
  ['script','剧情脚本（一句一行；下面接三行「选项|回应」）'],
  ['eggText','星星彩蛋小作文'],
  ['about','对话剧情（旧版备用，每行一句）'],
  ['optA','选项一'],['brA','选项一 · 回应（每行一句）'],
  ['optB','选项二'],['brB','选项二 · 回应（每行一句）'],
  ['optC','选项三'],['brC','选项三 · 回应（每行一句）'],
  ['rules','规矩（每行一条）'],
  ['q1','板评 I · 内容'],['q1c','板评 I · 小标（用 / 分隔）'],
  ['q2','话术 II · 内容'],['q2c','话术 II · 小标（用 / 分隔）'],
  ['links','链接（每行：名称|网址）'],
  ['scribble1','页内手写句一'],['scribble2','页内手写句二'],
  ['footer1','页脚署名'],['footL','左下署名'],['bgmLabel','音乐名'],
  ['avatar','头像图片网址'],['cover','封面图片网址']
];
var EDAREA = {about:1, rules:1, links:1, brA:1, brB:1, brC:1, script:1, eggText:1};

function edGet(k, f){
  if (k === 'q1' || k === 'q2') return (f[k] && f[k].text) || '';
  if (k === 'q1c' || k === 'q2c') return ((f[k.slice(0,2)] && f[k.slice(0,2)].choices) || []).join(' / ');
  if (k === 'links') return (f.links || []).map(function(x){ return (x.label||'') + (x.url ? '|' + x.url : ''); }).join('\n');
  var v = f[k];
  if (Array.isArray(v)) return v.join('、');
  if (v && typeof v === 'object') return '';
  return v == null ? '' : String(v);
}

function edMsg(t){
  var m = $('edMsg'); if (!m) return;
  m.textContent = t; m.classList.add('on');
  clearTimeout(edMsg._t);
  edMsg._t = setTimeout(function(){ m.classList.remove('on'); }, 2600);
}

var EGG_DEFAULT = '写给还没来的那个人：\n\n我第一次点灯的时候，以为这只是个习惯。' +
'后来才发现，是怕有人摸黑走上来，怕他在门口站太久，又不敢敲门。\n\n' +
'夜里来的人都不太说话。他们把名字放在门口，把故事留一半在口袋里。' +
'我不问，只把灯往前挪一点。\n\n' +
'如果你也在这条路上——不用急着证明自己值得被接住。你走到这里，就已经是了。\n\n' +
'灯一直亮着。不用敲门。';
if ($('egStar')){
  $('egStar').onclick = function(){
    var f = (CARD && CARD.f) || {};
    $('eggBody').textContent = (f.eggText || '').trim() || EGG_DEFAULT;
    $('eggBox').classList.add('on');
  };
}
if ($('eggClose')) $('eggClose').onclick = function(){ $('eggBox').classList.remove('on'); };
if ($('eggBox')) $('eggBox').onclick = function(e){ if (e.target === this) this.classList.remove('on'); };

function edOpen(){
  var f = (CARD && CARD.f) || {};
  var body = $('edBody'); if (!body) return;
  body.innerHTML = '';
  EFIELDS.forEach(function(it){
    var wrap = document.createElement('div'); wrap.className = 'ed-f';
    var lb = document.createElement('label'); lb.textContent = it[1];
    var inp = document.createElement(EDAREA[it[0]] ? 'textarea' : 'input');
    inp.value = edGet(it[0], f);
    inp.setAttribute('data-k', it[0]);
    wrap.appendChild(lb); wrap.appendChild(inp); body.appendChild(wrap);
  });
  $('edPanel').classList.add('on');
  document.body.style.overflow = 'hidden';
}

function edClose(){
  $('edPanel').classList.remove('on');
  document.body.style.overflow = '';
}

function edRead(){
  var f = JSON.parse(JSON.stringify((CARD && CARD.f) || {}));
  [].forEach.call($('edBody').querySelectorAll('[data-k]'), function(el){
    var k = el.getAttribute('data-k'), v = el.value;
    if (k === 'tags' || k === 'style'){
      f[k] = v.split(/[,，]/).map(function(x){ return x.trim(); }).filter(Boolean);
    } else if (k === 'rules'){
      f[k] = v.split('\n').map(function(x){ return x.trim(); }).filter(Boolean);
    } else if (k === 'links'){
      f.links = v.split('\n').map(function(line){
        var cut = line.split('|');
        if (!cut[0] || !cut[0].trim()) return null;
        return { label: cut[0].trim(), url: (cut[1] || '').trim(), key: 'LINK' };
      }).filter(Boolean);
    } else if (k === 'q1' || k === 'q2'){
      f[k] = f[k] || {}; f[k].text = v;
    } else if (k === 'q1c' || k === 'q2c'){
      var q = k.slice(0, 2); f[q] = f[q] || {};
      f[q].choices = v.split(/[\/／]/).map(function(x){ return x.trim(); }).filter(Boolean);
    } else {
      f[k] = v;
    }
  });
  return f;
}

function edApply(){
  var f = edRead();
  CARD = CARD || {}; CARD.f = f;
  fill(CARD);
  try{
    localStorage.setItem(ED_KEY, JSON.stringify(CARD));
    var db = JSON.parse(localStorage.getItem('cf_gh_v1') || 'null');
    if (db && db.cards && SLUG){
      db.cards.forEach(function(c){
        if (c && c.slug === SLUG){ c.f = f; if (CARD.title) c.title = CARD.title; }
      });
      localStorage.setItem('cf_gh_v1', JSON.stringify(db));
    }
  }catch(e){}
  return f;
}

function edPublish(cb){
  var f = edRead();
  var title = (CARD && CARD.title) || document.title;
  var db = {};
  try{ db = JSON.parse(localStorage.getItem('cf_gh_v1') || '{}'); }catch(e){}
  var tok = (db.set || {}).token, repo = (db.set || {}).repo || 'MoXiaoHei0/cards';
  if (!tok) return cb('没找到授权码，先回工厂保存一次设置');
  var path = location.pathname.replace(/^\//, '');
  var repoName = (repo.split('/')[1] || '');
  if (repoName && path.indexOf(repoName + '/') === 0) path = path.slice(repoName.length + 1);
  var payload = '<script>window.__CARD__=' + JSON.stringify({ f: f, title: title }) + ';<\/script>';
  var html = RAW_HTML.replace(/<script>window\.__CARD__=[\s\S]*?<\/script>/, function(){ return payload; });
  html = html.replace(/<title>[\s\S]*?<\/title>/, '<title>' + title + '</title>');
  var url = 'https://api.github.com/repos/' + repo + '/contents/' + path;
  var H = { Authorization: 'token ' + tok, Accept: 'application/vnd.github+json' };
  fetch(url, { headers: H })
    .then(function(r){ return r.json(); })
    .then(function(j){
      return fetch(url, { method: 'PUT',
        headers: { Authorization: 'token ' + tok, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: 'edit card from page', branch: 'main',
          content: btoa(unescape(encodeURIComponent(html))), sha: j && j.sha }) });
    })
    .then(function(r){ return r.json(); })
    .then(function(j){
      if (j && j.content){
        try{ localStorage.removeItem(ED_KEY); }catch(e){}
        cb(null);
      } else cb('发布失败：' + ((j && j.message) || '未知'));
    })
    .catch(function(e){ cb('网络错误：' + e); });
}

try{
  var eb = $('btnEdit');
  if (eb){
    eb.style.display = 'block';
    eb.onclick = edOpen;
    eb.title = (localStorage.getItem('cf_gh_astra_login') === '1')
      ? '就地修改这张卡' : '就地修改（只改这份文件，不发布）';
  }
  {
    var logged = (localStorage.getItem('cf_gh_astra_login') === '1');
    if ($('edPub') && !logged) $('edPub').style.display = 'none';
    if ($('edCancel')) $('edCancel').onclick = edClose;
    if ($('edSave')) $('edSave').onclick = function(){
      edApply();
      edMsg('已保存（本机可见，刷新还在）');
    };
    if ($('edPub')) $('edPub').onclick = function(){
      edApply();
      edMsg('正在发布…');
      edPublish(function(err){
        if (err) edMsg(err); else edMsg('已发布上线，10 分钟内全网生效');
      });
    };
  }
}catch(e){}

/* 键盘 */
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape') go('s2');
});

/* 启动 */
var INLINE = window.__CARD__ || null;
try{ var _dc = localStorage.getItem(ED_KEY); if (_dc && INLINE) INLINE = JSON.parse(_dc); }catch(e){}
if (INLINE){
  fill(INLINE);
  go('s1');
  return;
}
var DRAFT = /(\?|&)draft=1/.test(location.search);
if (DRAFT){
  fill({ f:{ name:'预览', brief:'平台里的实时预览', about:'第一段\n第二段' }, title:'预览' });
  go('s1');
  window.addEventListener('message', function(e){
    var d = e.data;
    if (d && d.type === 'draft' && d.card){
      fill(d.card);
    }
  });
  window.parent.postMessage({ type:'ready' }, '*');
  return;
}
fill({ f:{ name:'未命名' } });
go('s1');
})();
