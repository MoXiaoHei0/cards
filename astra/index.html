<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>星轨档案 · 已并入卡工厂</title>
<style>
  html,body{height:100%;margin:0;background:#05070d;color:#e9edf7;
    font-family:"Songti SC","Noto Serif SC",Georgia,serif}
  .box{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
  .k{font-size:10px;letter-spacing:.42em;color:#8b96b3;text-transform:uppercase}
  .t{font-size:19px;letter-spacing:.16em}
  .s{font-size:12px;color:#8b96b3;letter-spacing:.08em}
  .bar{width:120px;height:1px;background:linear-gradient(90deg,transparent,#8fa6d8,transparent);
    animation:p 1.4s ease-in-out infinite}
  @keyframes p{0%,100%{opacity:.25}50%{opacity:1}}
</style>
</head>
<body>
<div class="box">
  <div class="k">STAR TRACK</div>
  <div class="t" id="line">正在并入自介卡工厂…</div>
  <div class="bar"></div>
  <div class="s">这里的卡片会自动搬到统一的平台，链接不会变</div>
</div>
<script>
(function(){
  try{
    var old = localStorage.getItem('cf_gh_astra');
    if (old){
      var od = JSON.parse(old) || {};
      var cd = null;
      try{ cd = JSON.parse(localStorage.getItem('cf_gh_v1') || 'null'); }catch(e){ cd = null; }
      if (!cd || !cd.cards) cd = { pwd:{ admin:'1234', member:'8888' }, cards:[], set:{ repo:'MoXiaoHei0/cards', token:'', base:'https://moxiaohei0.github.io/cards/' } };
      if (!cd.set) cd.set = {};
      var have = {};
      cd.cards.forEach(function(c){ if (c && c.slug) have[c.slug] = 1; });
      var added = 0;
      (od.cards || []).forEach(function(c){
        if (c && c.slug && !have[c.slug]){ c.tpl = 'astra'; cd.cards.push(c); added++; }
      });
      localStorage.setItem('cf_gh_v1', JSON.stringify(cd));
      localStorage.removeItem('cf_gh_astra');
      if (added) document.getElementById('line').textContent = '已并入 ' + added + ' 张星轨卡，正在跳转…';
    }
  }catch(e){}
  var h = (location.hash || '').replace(/^#/, '');
  setTimeout(function(){ location.replace('../' + (h ? '#' + h : '')); }, 400);
})();
</script>
</body>
</html>
